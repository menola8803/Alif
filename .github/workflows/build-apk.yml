name: Build APK
# Builds a release APK on every push to main that touches the app, and on demand.
# Download it from the run page: Actions -> the run -> Artifacts.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Type check and tests
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Build the Qur'an text into the app
        # The Arabic (Uthmani) text goes into app/assets/quran so the APK has it offline. If this fails, the app downloads it on first start.
        continue-on-error: true
        run: node scripts/fetch-quran.js
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alif.p12"
            echo "ALIF_KEYSTORE_FILE=$RUNNER_TEMP/alif.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key is stored (secret ALIF_KEYSTORE_BASE64). This APK is signed with the public debug key and cannot update an install made with the real key."
          fi
      - name: Check the signing key
        if: env.ALIF_KEYSTORE_FILE != ''
        env:
          ALIF_KEYSTORE_PASSWORD: ${{ secrets.ALIF_KEYSTORE_PASSWORD }}
          ALIF_KEY_ALIAS: ${{ secrets.ALIF_KEY_ALIAS }}
          ALIF_KEY_PASSWORD: ${{ secrets.ALIF_KEY_PASSWORD }}
          SECRET_NAMES: ${{ toJSON(secrets) }}
        run: |
          # Clear messages (never the values) when a secret does not fit the key file.
          # Names (not values) of the secrets this repository has, to spot a misspelt or misplaced one.
          echo "::notice::Secrets available to this build: $(echo "$SECRET_NAMES" | jq -r 'keys - ["github_token"] | join(", ")')"
          [ -n "$ALIF_KEYSTORE_PASSWORD" ] || { echo "::error::The secret ALIF_KEYSTORE_PASSWORD is empty."; exit 1; }
          [ -n "$ALIF_KEY_ALIAS" ] || { echo "::error::The secret ALIF_KEY_ALIAS is empty."; exit 1; }
          [ "$ALIF_KEY_PASSWORD" = "$ALIF_KEYSTORE_PASSWORD" ] || echo "::warning::ALIF_KEY_PASSWORD differs from ALIF_KEYSTORE_PASSWORD (for this key they must be the same)."
          LIST=$(keytool -list -keystore "$ALIF_KEYSTORE_FILE" -storetype PKCS12 -storepass:env ALIF_KEYSTORE_PASSWORD 2>&1) || { echo "::error::The key file could not be opened: ALIF_KEYSTORE_BASE64 is not the whole line, or ALIF_KEYSTORE_PASSWORD is wrong. $(printf %s "$LIST" | grep -i 'keytool error' | head -1)"; exit 1; }
          printf %s "$LIST" | grep -qi "^${ALIF_KEY_ALIAS}," || { echo "::error::The alias in ALIF_KEY_ALIAS was not found in the key file (it should be: alif)."; exit 1; }
          echo "Signing key OK."
      - name: Build release APK
        working-directory: app/android
        env:
          ALIF_KEYSTORE_PASSWORD: ${{ secrets.ALIF_KEYSTORE_PASSWORD }}
          ALIF_KEY_ALIAS: ${{ secrets.ALIF_KEY_ALIAS }}
          ALIF_KEY_PASSWORD: ${{ secrets.ALIF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk
      - name: Name the APK
        id: name
        run: |
          VER=$(node -p "require('./app/package.json').version")
          echo "file=Alif-${VER}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Alif-${VER}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
          if-no-files-found: error
