name: Release
# A release is made for a tag vX.Y.Z, and also automatically when the version in app/package.json changes on main
# (the tag is then created here). The APK is built and attached as Alif-vX.Y.Z.apk and Alif.apk.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$(node -p "require('./app/package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # On main: only when there is no release for this version yet.
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$TAG" >/dev/null 2>&1; then echo "build=false" >> "$GITHUB_OUTPUT"; else echo "build=true" >> "$GITHUB_OUTPUT"; fi
      - name: Create release with zip
        if: steps.tag.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip -qr "alif-${TAG}.zip" . -x '.git/*'
          # The release may already exist (e.g. created by hand with an APK): then only add the zip.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "alif-${TAG}.zip" --clobber
          else
            gh release create "$TAG" "alif-${TAG}.zip" --target "${GITHUB_SHA}" --title "Alif ${TAG}" --generate-notes
          fi

  apk:
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Build the Qur'an text into the app
        # The Arabic (Uthmani) text goes into app/assets/quran so the APK has it offline. If this fails, the app downloads it on first start.
        continue-on-error: true
        run: node scripts/fetch-quran.js
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      # Alif's own signing key is used when the secret is stored. Once app/signing/cert-sha256.txt exists in the repository
      # (made by scripts/new-signing-key.sh) a release MUST be signed with that key: without the secret the build stops here,
      # and the signature check below stops it too if the APK was signed with anything else. Before that file exists the
      # release is signed with the public debug key as in earlier versions, so phones can still update in place.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf %s "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alif.p12"
            echo "ALIF_KEYSTORE_FILE=$RUNNER_TEMP/alif.p12" >> "$GITHUB_ENV"
          elif [ -s app/signing/cert-sha256.txt ]; then
            echo "::error::app/signing/cert-sha256.txt says releases are signed with Alif's own key, but the secret ALIF_KEYSTORE_BASE64 is missing."
            exit 1
          else
            echo "::warning::No signing key is stored: this release is signed with the public debug key."
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          ALIF_KEYSTORE_PASSWORD: ${{ secrets.ALIF_KEYSTORE_PASSWORD }}
          ALIF_KEY_ALIAS: ${{ secrets.ALIF_KEY_ALIAS }}
          ALIF_KEY_PASSWORD: ${{ secrets.ALIF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the signature
        run: bash scripts/check-apk-signature.sh app/android/app/build/outputs/apk/release/app-release.apk
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          cp app/android/app/build/outputs/apk/release/app-release.apk "Alif-${TAG}.apk"
          # Fixed name: https://github.com/<owner>/<repo>/releases/latest/download/Alif.apk always points at the newest release.
          cp "Alif-${TAG}.apk" Alif.apk
          gh release upload "$TAG" "Alif-${TAG}.apk" Alif.apk --clobber
